<!doctype html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title data-i18n="pageTitle">Pannkaksrecept</title>

        <script defer src="../js/BetterFrontendAssignmentScript.js"></script>
        <link rel="stylesheet" href="../css/BetterFrontendAssignmentStyle.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="language-switcher">
                <button type="button" data-language="sv">Svenska</button>
                <button type="button" data-language="en">English</button>
            </nav>
            <img class="HeroImage" src="../Assets/Pannkakor4.jpg" alt="En bild av pannkakor" data-i18n="heroImageAlt" />
            <h1 data-i18n="heroTitle">Enkelt recept på pannkakor</h1>
            <p class="note" data-i18n="heroDescription">Gör traditionella tunna pannkakor med detta enkla och goda recept.</p>
        </header>
        <main>
            <h2 data-i18n="ingredientsHeading">Ingredienser</h2>
            <p class="text" data-i18n="servings">För 4 portioner</p>
            <ul>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="flour">2 1/2 dl vetemjöl</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="salt">1/2 tsk salt</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="milk">6 dl mjölk</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="eggs">3 ägg</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="butter">Smör till stekning</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="toppings">Sylt, bär eller frukt till servering</span>
                    </label>
                </li>
            </ul>
            <h2 data-i18n="instructionsHeading">Så här gör du</h2>
            <ol>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="step1">Blanda mjöl och salt i en bunke.</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="step2">Vispa i hälften av mjölken till en slät smet.</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="step3">Vispa i resten av mjölken och äggen.</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="step4">Låt smeten vila i ca 10 minuter.</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="step5">Stek tunna pannkakor i lite smör, en i taget, i en stekpanna.</span>
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span data-i18n="step6">Servera med sylt, bär eller frukt.</span>
                    </label>
                </li>
            </ol>
            <h2 data-i18n="servingHeading">Serveringsförslag</h2>
            <div class="PancakeImage">
                <img src="../Assets/Pannkakor2.jpg" alt="Pannkakor serverade med tillbehör" data-i18n-alt="image2Alt" />
                <img src="../Assets/Pannkakor1.jpg" alt="En första pannkaksbild"/>
            </div>
        </main>
    </body>
</html>
