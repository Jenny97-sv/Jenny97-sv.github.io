<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pannkaksrecept</title>

    <script defer src="../js/PancakeRecipeScript.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!-- Menu -->
    <header class="site-header">
        <a href="../index.html" class="logo">
            <img src="../Assets/CoffeMug.png" alt="CoffeMug">
            <span>Jennys recept</span>
        </a>
        <nav aria-label="Huvudmeny">
            <a class="button" href="../Pages/About.html">Om sajten</a>
            <a class="button" href="../Pages/ShareRecipe.html">Dela recept</a>
        </nav>
    </header>

    <main id="main-content" tabindex="-1">
        <!-- Row 1: image left, text right -->
        <section class="hero">
            <img class="HeroImage" src="../Assets/Pannkakor4.jpg" alt="Pannkakor">
            <div class="hero-text">
                <h1>Enkelt recept på pannkakor</h1>
                <p class="note">Gör traditionella tunna pannkakor med detta enkla och goda recept.</p>
                <ul class="facts">
                    <li>4 port</li>
                    <li>30 min</li>
                    <li>Lätt</li>
                </ul>
            </div>
        </section>

        <!-- Row 2: ingredients left, instructions right -->
        <section class="recipe">
            <div class="ingredients">
                <h2>Ingredienser</h2>
                <p class="text">För 4 portioner</p>
                <ul>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>2 1/2 dl vetemjöl</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>1/2 tsk salt</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>6 dl mjölk</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>3 ägg</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Smör till stekning</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Sylt, bär eller frukt till servering</span>
                        </label>
                    </li>
                </ul>
            </div>

            <div class="instructions">
                <h2>Så här gör du</h2>
                <ol>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Blanda mjöl och salt i en bunke.</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Vispa i hälften av mjölken till en slät smet.</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Vispa i resten av mjölken och äggen.</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Låt smeten vila i ca 10 minuter.</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Stek tunna pannkakor i lite smör, en i taget, i en stekpanna.</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Servera med sylt, bär eller frukt.</span>
                        </label>
                    </li>
                </ol>
            </div>
        </section>

        <!-- Row 3: serving suggestions -->
        <section class="serving">
            <h2>Serveringsförslag</h2>
            <div class="PancakeImage">
                <figure>
                    <img src="../Assets/Pannkakor2.jpg" alt="Grädde och blåbär">
                    <figcaption>Med grädde och blåbär</figcaption>
                </figure>
                <figure>
                    <img src="../Assets/Pannkakor1.jpg" alt="Grädde och hallon">
                    <figcaption>Med grädde och hallon</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Jennys recept</p>
    </footer>
</body>
</html>
